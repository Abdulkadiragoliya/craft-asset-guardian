<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#0f223d" />
      <stop offset="55%" stop-color="#081324" />
      <stop offset="100%" stop-color="#040913" />
    </radialGradient>

    <!-- Shield Left (Electric Sky Blue Ribbon) -->
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Shield Right (Vibrant Emerald / Mint Ribbon) -->
    <linearGradient id="shieldGreen" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shield Bottom Fold Highlight (Cyan to Teal) -->
    <linearGradient id="bottomRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Shield Top Peak Highlight -->
    <linearGradient id="peakHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Back File Sheet (Cyan-Blue) -->
    <linearGradient id="fileBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Folded Corner Flap -->
    <linearGradient id="foldFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Front White Card -->
    <linearGradient id="frontCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Inner Picture Frame (Royal Indigo) -->
    <linearGradient id="pictureBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122b54" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Security Badge (Emerald Glow) -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Picture Area Clip Path -->
    <clipPath id="pictureClip">
      <rect x="170" y="214" width="112" height="96" rx="14" />
    </clipPath>
  </defs>

  <!-- App Squircle Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />

  <!-- Shield Base Cavity (Deep Midnight Backdrop) -->
  <path d="M 256, 52
           C 268, 52 396, 114 412, 126
           C 428, 138 430, 236 412, 312
           C 394, 386 284, 428 256, 436
           C 228, 428 118, 386 100, 312
           C 82, 236 84, 138 100, 126
           C 116, 114 244, 52 256, 52 Z"
        fill="#030813" />

  <!-- Outer Shield: Left Blue Dimensional Ribbon -->
  <path d="M 256, 52
           C 244, 52 116, 114 100, 126
           C 82, 138 82, 236 100, 312
           C 118, 386 228, 428 256, 436
           C 256, 436 216, 396 178, 342
           C 142, 290 134, 222 144, 168
           C 152, 124 212, 86 256, 52 Z"
        fill="url(#shieldBlue)" />

  <!-- Outer Shield: Right Emerald / Mint Ribbon -->
  <path d="M 256, 52
           C 268, 52 396, 114 412, 126
           C 428, 138 428, 236 412, 312
           C 394, 386 284, 428 256, 436
           C 256, 436 296, 396 334, 342
           C 370, 290 378, 222 368, 168
           C 360, 124 300, 86 256, 52 Z"
        fill="url(#shieldGreen)" />

  <!-- Shield Bottom 3D Fold Wrap -->
  <path d="M 218, 396
           C 236, 420 256, 436 256, 436
           C 256, 436 276, 420 294, 396
           C 272, 408 240, 408 218, 396 Z"
        fill="url(#bottomRibbon)" />

  <!-- Shield Top Crest Apex Glow -->
  <path d="M 226, 62
           C 244, 52 268, 52 286, 62
           C 274, 76 238, 76 226, 62 Z"
        fill="url(#peakHighlight)" opacity="0.95" />

  <!-- Back Blue Folded File Sheet Shadow -->
  <path d="M 204, 146
           L 282, 146
           L 334, 198
           L 334, 292
           A 22,22 0 0,1 312, 314
           L 204, 314
           A 22,22 0 0,1 182, 292
           L 182, 168
           A 22,22 0 0,1 204, 146 Z"
        fill="#020914" opacity="0.55" />

  <!-- Back Blue Folded File Sheet Body -->
  <path d="M 204, 142
           L 282, 142
           L 330, 190
           L 330, 286
           A 20,20 0 0,1 310, 306
           L 204, 306
           A 20,20 0 0,1 184, 286
           L 184, 162
           A 20,20 0 0,1 204, 142 Z"
        fill="url(#fileBlue)" />

  <!-- Dog-Ear Fold Shadow Under Flap -->
  <path d="M 280, 192
           L 280, 178
           L 332, 192 Z"
        fill="#0a2a6b" opacity="0.4" />

  <!-- Dog-Ear Folded Flap -->
  <path d="M 282, 142
           L 282, 178
           A 12,12 0 0,0 294, 190
           L 330, 190 Z"
        fill="url(#foldFlap)" />

  <!-- Front White Card Shadow -->
  <rect x="148" y="198" width="156" height="140" rx="28" fill="#020914" opacity="0.6" />

  <!-- Front White Card Body -->
  <rect x="150" y="194" width="152" height="136" rx="26" fill="url(#frontCard)" />

  <!-- Inset Picture Frame -->
  <rect x="170" y="214" width="112" height="96" rx="14" fill="url(#pictureBg)" />

  <!-- Picture Artwork (Sun + Mountains) -->
  <g clip-path="url(#pictureClip)">
    <!-- Sun -->
    <circle cx="204" cy="242" r="12" fill="#ffffff" />

    <!-- Mountain Soft Shadow Backing -->
    <path d="M 160, 314
             L 194, 274
             A 6,6 0 0,1 204, 274
             L 226, 296
             L 242, 280
             A 6,6 0 0,1 252, 280
             L 290, 314 Z"
          fill="#ffffff" />

    <!-- Mountain Dimensional Crevasse Shadow -->
    <path d="M 200, 272
             L 226, 296
             L 214, 314
             L 188, 314 Z"
          fill="#c7dcf8" opacity="0.75" />

    <path d="M 248, 278
             L 272, 302
             L 262, 314
             L 238, 314 Z"
          fill="#c7dcf8" opacity="0.75" />
  </g>

  <!-- Green Security Checkmark Badge Shadow -->
  <circle cx="330" cy="296" r="54" fill="#020914" opacity="0.55" />

  <!-- Green Security Checkmark Badge Body -->
  <circle cx="330" cy="292" r="50" fill="url(#badgeGrad)" />

  <!-- Badge Inner Highlight Arc -->
  <path d="M 292, 268
           A 46,46 0 0,1 368, 268
           A 48,48 0 0,0 292, 268 Z"
        fill="#86efac" opacity="0.5" />

  <!-- Bold Dark Navy Checkmark -->
  <path d="M 306, 292
           L 322, 308
           L 356, 272"
        fill="none"
        stroke="#062130"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>